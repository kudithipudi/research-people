<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0C10'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2345E6AC' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2345E6AC'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ prefix }}/static/css/app.css" />
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"
  integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb"
  crossorigin="anonymous"></script>
<script>
  function timeAgo(iso) {
    const then = new Date(iso.includes("Z") || iso.includes("+") ? iso : iso + "Z").getTime();
    const s = Math.max(0, Math.floor((Date.now() - then) / 1000));
    if (s < 5) return "just now";
    if (s < 60) return s + "s ago";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  }
  function refreshTimestamps() {
    document.querySelectorAll("[data-ts]").forEach((el) => {
      el.textContent = timeAgo(el.dataset.ts);
    });
  }
  document.addEventListener("DOMContentLoaded", () => {
    refreshTimestamps();
    setInterval(refreshTimestamps, 30000);
  });
</script>
</head>
<body class="bg-void text-ink font-sans antialiased min-h-screen flex flex-col">
  <header class="bg-panel2 sticky top-0 z-30 border-b border-line">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
      <div class="min-w-0 flex items-center gap-3">
        <a href="{{ prefix }}/" class="shrink-0 w-9 h-9 rounded-md border border-signal/40 bg-void flex items-center justify-center">
          <span class="w-2.5 h-2.5 rounded-full border-2 border-signal"></span>
        </a>
        <div class="min-w-0">
          <h1 class="text-sm font-semibold tracking-widest uppercase text-ink truncate">
            <a href="{{ prefix }}/" class="hover:text-signal transition">{{ app_name }}</a>
          </h1>
          <p class="eyebrow truncate">// username dossier search · maigret</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        {% block header_links %}
        <nav class="hidden sm:flex items-center gap-1">
          <a href="{{ prefix }}/" class="btn-ghost">New scan</a>
        </nav>
        {% endblock %}
        {% if request.session.get('is_admin') %}
        <form method="post" action="{{ prefix }}/logout">
          <button type="submit" class="btn-ghost">Log out</button>
        </form>
        {% else %}
        <a href="{{ prefix }}/login" class="btn-ghost">Log in</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-line">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-2 font-mono text-[11px] text-inkfaint">
      <span>part of the <a href="https://lab.kudithipudi.org/" class="text-inkdim hover:text-signal transition">kudithipudi ai lab</a></span>
      <span>results are best-effort · some sites block datacenter ips</span>
    </div>
  </footer>
</body>
</html>
