{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block content %}
<section class="max-w-sm mx-auto">
  <div class="rounded-xl border border-slate-200 bg-white shadow-sm p-6">
    <p class="text-xs font-semibold uppercase tracking-widest text-indigo-600 mb-1">// authenticate</p>
    <h2 class="text-xl font-bold tracking-tight text-slate-900 mb-1">Log in to scan</h2>
    <p class="text-sm text-slate-500 mb-6">Runs against thousands of external sites — sign in to start one.</p>

    {% if error %}
    <p class="mb-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
      Wrong password, try again.
    </p>
    {% endif %}

    <form method="post" action="{{ prefix }}/login" class="space-y-4">
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Shared password</label>
        <div class="flex items-center rounded-lg border border-slate-300 bg-white transition focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500">
          <span class="pl-3 pr-1 text-sm text-indigo-600 select-none">$</span>
          <input type="password" id="password" name="password" required autofocus autocomplete="current-password"
            class="flex-1 min-w-0 bg-transparent px-1.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none" />
        </div>
      </div>
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Log in →</button>
    </form>
  </div>
</section>
{% endblock %}
